# GitBook site-level Git Sync. In GitBook: project directory = packages/sdk-node, sync GitHub → GitBook.
# Edit the docs here in the repo, not in the GitBook editor (two-way sync commits straight to main).
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: QuietPay Docs
  structure:
    - type: space
      key: space-1
      title: Documentation
      path: documentation
      default: true
      content:
        directory: docs
