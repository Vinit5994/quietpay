name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ownership check
        run: bash scripts/check-ownership.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Did contracts change?
        id: contracts
        run: |
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep -q '^contracts/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.contracts.outputs.changed == 'true'

      - name: forge build + test
        if: steps.contracts.outputs.changed == 'true'
        working-directory: contracts
        run: |
          forge build --sizes
          forge test -vv
